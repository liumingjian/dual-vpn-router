[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-vpn-router"
version = "0.1.0"
description = "A macOS CLI coordinating OpenConnect tunnels, routes and split DNS"
requires-python = ">=3.11"

[project.scripts]
dvr = "dual_vpn_router.cli:main"

[tool.setuptools.packages.find]
include = ["dual_vpn_router*"]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
